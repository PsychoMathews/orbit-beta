<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Protótipo Orb</title>
<style>
:root{--bg:#1b1d24}
body{margin:0;background:linear-gradient(135deg,#2a3550,#5a4a6a 50%,#c9b9a0);min-height:100vh;font:13px system-ui;color:#ddd;display:flex;flex-direction:column;align-items:center;gap:28px;padding-top:30px}
.pill{background:#000;border-radius:22px;height:44px;display:flex;align-items:center;padding:0 10px;gap:8px;width:44px;box-sizing:border-box;transition:width .45s cubic-bezier(.3,1.4,.5,1);overflow:hidden}
.pill.wide{width:236px}
.pill canvas{display:block;flex:none}
#wave{opacity:0;transition:opacity .3s}
.pill.wide #wave{opacity:1}
.panel{background:#000a;padding:14px 18px;border-radius:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{background:#222;color:#ddd;border:1px solid #444;border-radius:8px;padding:5px 10px;cursor:pointer}
button.on{border-color:#8ab4ff;color:#fff}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff3;cursor:pointer}
</style></head><body>
<div class="pill" id="pill"><canvas id="orb" width="64" height="64" style="width:32px;height:32px;margin-left:-4px"></canvas><canvas id="wave" width="360" height="72" style="width:180px;height:36px"></canvas></div>
<div class="panel">
 <div class="row" id="states"></div>
 <div class="row">Modo: <button data-m="grad" class="on">Gradiente</button><button data-m="solid">Sólida</button>
  <input type="color" id="c1" value="#2f7bff"><input type="color" id="c2" value="#9b5cff"><input type="color" id="c3" value="#ff6fb5"></div>
 <div class="row" id="presets">Presets:</div>
 <div class="row" style="opacity:.7">fps ativo: <span id="fps">0</span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const orb=$('#orb').getContext('2d'),wave=$('#wave').getContext('2d'),pill=$('#pill');
let target=0,lvlT=0,state='parado',mode='grad',raf=0,t=0,level=0,last=0,frames=0,fpsT=0;
const presets={'Padrão':['#2f7bff','#9b5cff','#ff6fb5'],'Ciano':['#00e5ff','#2f7bff','#7cf7ff'],'Âmbar':['#ffb020','#ff5a36','#ffe08a'],'Verde':['#2bff9a','#00b3ff','#c6ff6b']};
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
function col(k){const c=[$('#c1').value,$('#c2').value,$('#c3').value].map(hex);if(mode==='solid')return c[0];return k<.5?mix(c[0],c[1],k*2):mix(c[1],c[2],(k-.5)*2)}
// esfera de pontos (fibonacci)
const N=180,pts=[];for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.39996;pts.push([Math.cos(a)*r,y,Math.sin(a)*r])}
// anel de energia: vários fios translúcidos ondulando em volta de um círculo
const STR=9;
// esfera de malha deformada (wireframe): latitudes + longitudes empurradas
// por um "ruído" de senos; a deformação cresce com o volume (level)
const LAT=13,LON=18,SEG=28;
const dust=Array.from({length:40},(_,i)=>[Math.random()*7,1.05+Math.random()*.35,Math.random()]);
function disp(x,y,z,amp){
 return 1+amp*(Math.sin(x*3.1+t*1.3)*Math.sin(y*2.7-t*1.1)*.5+Math.sin(z*4.3+y*2+t*1.7)*.3+Math.sin((x+z)*5.5-t*2.2)*.15);
}
// orb líquido: camadas de "seda" fechadas, de fora para dentro, cada uma
// deformada por lóbulos lentos com fase própria; o miolo também se mexe
const LAYERS=16;
function drawOrbLiquido(){
 const W=64,c=W/2;orb.clearRect(0,0,W,W);
 const dead=state==='offline',mute=state==='mudo';
 const gray=cc=>{const m=(cc[0]+cc[1]+cc[2])/3;return[m*.9,m*.9,m]};
 const C=k=>{let cc=col(k);return mute||dead?gray(cc):cc};
 const R=19,A=dead?.35:1;
 const amp=dead||mute?.05:.12+level*.35+(state==='pensando'?.06:0);
 const cg=orb.createConicGradient(t*.3+.8,c,c);
 [0,.33,.66,1].forEach((s,i)=>cg.addColorStop(s,`rgb(${C([0,.5,1,0][i])})`));
 const hg=orb.createRadialGradient(c,c,R*.2,c,c,R*1.5);
 hg.addColorStop(0,`rgba(${C(.5)},${.16*A})`);hg.addColorStop(1,'rgba(0,0,0,0)');
 orb.fillStyle=hg;orb.fillRect(0,0,W,W);
 orb.globalCompositeOperation='lighter';orb.strokeStyle=cg;
 for(let L=0;L<LAYERS;L++){
  const f=L/(LAYERS-1),s=1-f*.72;                 // escala: borda -> miolo
  const ox=Math.sin(t*.7+f*3)*R*.18*f,oy=Math.cos(t*.55+f*2.4)*R*.18*f; // o miolo "balança"
  orb.beginPath();
  for(let i=0;i<=40;i++){
   const a=i/40*Math.PI*2;
   const n=Math.sin(a*2+t*.9+f*2.2)*.55+Math.sin(a*3-t*1.15+f*3.7)*.35+Math.sin(a*5+t*1.6-f*4)*.18*(1+level);
   const r=R*s*(1+amp*n*(.6+f*.8));
   const x=c+ox+Math.cos(a)*r,y=c+oy+Math.sin(a)*r;i?orb.lineTo(x,y):orb.moveTo(x,y);
  }
  orb.globalAlpha=(L===0?.95:.16+.18*(1-f))*A;orb.lineWidth=L===0?1.4:.8;orb.stroke();
 }
 orb.globalAlpha=1;
 for(const [a,r,k] of dust){
  const aa=a+t*.15,rr=R*(r+level*.2);
  orb.fillStyle=`rgba(${C(k)},${.45*A})`;orb.fillRect(c+Math.cos(aa)*rr,c+Math.sin(aa)*rr,.9,.9);
 }
 orb.globalCompositeOperation='source-over';
 if(mute){orb.strokeStyle='#ddd';orb.lineWidth=3;orb.beginPath();orb.moveTo(18,46);orb.lineTo(46,18);orb.stroke()}
}
function drawOrbMalha(){
 const W=64,c=W/2;orb.clearRect(0,0,W,W);
 const dead=state==='offline',mute=state==='mudo';
 const gray=cc=>{const m=(cc[0]+cc[1]+cc[2])/3;return[m*.9,m*.9,m]};
 const C=k=>{let cc=col(k);return mute||dead?gray(cc):cc};
 const R=21,A=dead?.35:1;
 const amp=dead||mute?.04:.07+level*.32+(state==='pensando'?.06:0);
 const ry=t*.35,rx=.35,cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);
 const P=(th,ph)=>{ // th = latitude, ph = longitude
  let x=Math.cos(th)*Math.cos(ph),y=Math.sin(th),z=Math.cos(th)*Math.sin(ph);
  const d=disp(x,y,z,amp);x*=d;y*=d;z*=d;
  let X=x*cy-z*sy,Z=x*sy+z*cy,Y=y*cx-Z*sx;Z=y*sx+Z*cx;
  return[c+X*R,c+Y*R,Z];
 };
 // brilho de fundo
 const hg=orb.createRadialGradient(c,c,R*.2,c,c,R*1.45);
 hg.addColorStop(0,`rgba(${C(.5)},${.18*A})`);hg.addColorStop(1,'rgba(0,0,0,0)');
 orb.fillStyle=hg;orb.fillRect(0,0,W,W);
 orb.globalCompositeOperation='lighter';orb.lineWidth=.6;
 const line=pts=>{
  for(let i=1;i<pts.length;i++){
   const [x0,y0,z0]=pts[i-1],[x1,y1,z1]=pts[i];
   const k=Math.min(1,Math.max(0,((x0-c)+(y0-c))/(R*2.4)+.5)); // azul em cima/esquerda, rosa embaixo/direita
   const front=(z0+z1)/2;
   orb.strokeStyle=`rgba(${C(k)},${(front<0?.75:.22)*A})`;
   orb.beginPath();orb.moveTo(x0,y0);orb.lineTo(x1,y1);orb.stroke();
  }
 };
 for(let i=1;i<LAT;i++){const th=-Math.PI/2+i*Math.PI/LAT,p=[];for(let j=0;j<=SEG;j++)p.push(P(th,j/SEG*Math.PI*2));line(p)}
 for(let j=0;j<LON;j++){const ph=j/LON*Math.PI*2,p=[];for(let i=0;i<=SEG/2;i++)p.push(P(-Math.PI/2+i/(SEG/2)*Math.PI,ph));line(p)}
 // poeira de partículas em volta
 for(const [a,r,k] of dust){
  const aa=a+t*.15,rr=R*(r+level*.15);
  orb.fillStyle=`rgba(${C(k)},${.5*A})`;orb.fillRect(c+Math.cos(aa)*rr,c+Math.sin(aa)*rr,.9,.9);
 }
 orb.globalCompositeOperation='source-over';
 if(mute){orb.strokeStyle='#ddd';orb.lineWidth=3;orb.beginPath();orb.moveTo(18,46);orb.lineTo(46,18);orb.stroke()}
}
function drawOrb(){
 const W=64,c=W/2;orb.clearRect(0,0,W,W);
 const dead=state==='offline',mute=state==='mudo';
 const gray=cc=>{const m=(cc[0]+cc[1]+cc[2])/3;return[m*.9,m*.9,m]};
 const C=k=>{let cc=col(k);return mute||dead?gray(cc):cc};
 const R=20*(1+level*.12),A=dead?.35:1;
 // gradiente que gira em volta do anel (azul -> roxo -> rosa -> azul)
 const cg=orb.createConicGradient(t*.4,c,c);
 [0,.33,.66,1].forEach((s,i)=>cg.addColorStop(s,`rgb(${C([0,.5,1,0][i])})`));
 // halo
 const hg=orb.createRadialGradient(c,c,R*.7,c,c,R*1.5);
 hg.addColorStop(0,'rgba(0,0,0,0)');hg.addColorStop(.35,`rgba(${C(.4)},${.28*A})`);hg.addColorStop(1,'rgba(0,0,0,0)');
 orb.fillStyle=hg;orb.fillRect(0,0,W,W);
 orb.globalCompositeOperation='lighter';orb.strokeStyle=cg;
 const energy=.6+level*1.4+(state==='pensando'?.5:0);
 for(let s=0;s<STR;s++){
  const ph=s*.7,sp=.5+s*.13;orb.beginPath();
  for(let i=0;i<=64;i++){
   const a=i/64*Math.PI*2;
   const off=(Math.sin(a*2+t*sp+ph)*1.6+Math.sin(a*3-t*sp*.8+ph*2)*1.1+Math.sin(a*5+t*1.3+s))*energy;
   const r=R+off*(s%3===0?.4:1);
   const x=c+Math.cos(a)*r,y=c+Math.sin(a)*r;i?orb.lineTo(x,y):orb.moveTo(x,y);
  }
  orb.globalAlpha=(s===0?.9:.22)*A;orb.lineWidth=s===0?1.6:1;orb.stroke();
 }
 // núcleo do anel mais brilhante
 orb.globalAlpha=.18*A;orb.lineWidth=5;
 orb.beginPath();orb.arc(c,c,R,0,7);orb.stroke();orb.globalAlpha=.35*A;orb.lineWidth=2.4;orb.stroke();
 orb.globalAlpha=1;orb.globalCompositeOperation='source-over';
 if(mute){orb.strokeStyle='#ddd';orb.lineWidth=3;orb.beginPath();orb.moveTo(18,46);orb.lineTo(46,18);orb.stroke()}
}
// superfície 3D de pontos: linhas em profundidade (z), projetadas em perspectiva
const ROWS=14,COLS=70;
function drawWave(){
 const W=360,H=72;wave.clearRect(0,0,W,H);wave.globalCompositeOperation='lighter';
 const amp=state==='pensando'?.8:.45+level*1.6;
 for(let r=0;r<ROWS;r++){
  const z=r/(ROWS-1);               // 0 = frente, 1 = fundo
  const p=1/(1+z*1.6);              // perspectiva
  for(let i=0;i<COLS;i++){
   const u=i/(COLS-1),fade=Math.sin(u*Math.PI)**1.2;
   const h=(Math.sin(u*7+t*1.7+z*2.4)*.6+Math.sin(u*3.3-t*1.1+z*4)*.5+Math.sin(u*13+t*2.6-z*3)*.18)*amp*fade;
   const x=W/2+(u-.5)*W*(.62+.38*p);
   const y=H*.5+(z-.5)*H*.42*p-h*H*.34*p;
   const cc=col(Math.min(1,u*.7+z*.5));
   const a=(.25+.75*p)*(.35+.65*fade)*(.55+Math.max(0,h)*.6);
   wave.fillStyle=`rgba(${cc},${Math.min(1,a)})`;
   const s=.9+p*1.3;wave.fillRect(x,y,s,s);
  }
 }
 wave.globalCompositeOperation='source-over';
}
function loop(now){
 raf=0;
 // tempo real (não depende do fps) + nível suavizado: sem trancos
 const dt=Math.min(.05,(now-(last||now))/1000);last=now;t+=dt;frames++;
 { const v=state==='falando'?1:state==='ouvindo'?.6:0; target=v*Math.max(0,.45+.3*Math.sin(t*5.3)+.2*Math.sin(t*8.7+1)+.15*Math.sin(t*2.1)); }
 level+=(target-level)*(1-Math.exp(-dt*10));
 drawOrb();drawWave();
 if(now-fpsT>1000){$('#fps').textContent=frames;frames=0;fpsT=now}
 if(['ouvindo','pensando','falando'].includes(state))raf=requestAnimationFrame(loop);else{$('#fps').textContent=0;level=0;target=0;last=0;drawOrb()}
}
function setState(s){state=s;pill.classList.toggle('wide',['pensando','falando','ouvindo'].includes(s));
 document.querySelectorAll('#states button').forEach(b=>b.classList.toggle('on',b.textContent===s));
 if(!raf)raf=requestAnimationFrame(loop)}
['parado','ouvindo','pensando','falando','mudo','offline'].forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>setState(s);$('#states').append(b)});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));redraw()});
Object.entries(presets).forEach(([n,c])=>{const s=document.createElement('div');s.className='sw';s.title=n;s.style.background=`linear-gradient(135deg,${c})`;s.onclick=()=>{['#c1','#c2','#c3'].forEach((id,i)=>$(id).value=c[i]);redraw()};$('#presets').append(s)});
['#c1','#c2','#c3'].forEach(id=>$(id).oninput=redraw);
function redraw(){drawOrb();drawWave()}
setState('parado');
</script></body></html>
